<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <title>SignIn | CAD </title>
    <link rel="icon" type="image/x-icon" href="../src/assets/img/favicon.ico"/>
    <link href="../layouts/vertical-light-menu/css/light/loader.css" rel="stylesheet" type="text/css" />
    <link href="../layouts/vertical-light-menu/css/dark/loader.css" rel="stylesheet" type="text/css" />
    <script src="../layouts/vertical-light-menu/loader.js"></script>
    <!-- BEGIN GLOBAL MANDATORY STYLES -->
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,600,700" rel="stylesheet">
    <link href="../src/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="../layouts/vertical-light-menu/css/light/plugins.css" rel="stylesheet" type="text/css" />
    <link href="../src/assets/css/light/authentication/auth-boxed.css" rel="stylesheet" type="text/css" />
    <link href="../layouts/vertical-light-menu/css/dark/plugins.css" rel="stylesheet" type="text/css" />
    <link href="../src/assets/css/dark/authentication/auth-boxed.css" rel="stylesheet" type="text/css" />
    <!-- END GLOBAL MANDATORY STYLES -->
    
</head>
<body class="form">

    <!-- BEGIN LOADER -->
    <div id="load_screen"> <div class="loader"> <div class="loader-content">
        <div class="spinner-grow align-self-center"></div>
    </div></div></div>
    <!--  END LOADER -->

    <div class="auth-container d-flex">

        <div class="container mx-auto align-self-center">
    
            <div class="row">
    
                <div class="col-xxl-4 col-xl-5 col-lg-5 col-md-8 col-12 d-flex flex-column align-self-center mx-auto">
                    <div class="card mt-3 mb-3">
                        <div class="card-body">
    
                            <div class="row">
                                <div class="col-md-12 mb-3 text-center">
                                    <h2>CAD - App</h2>
                                    <p>Enter your username and password to login</p>
                                </div>
                                <div class="col-md-12">
                                    <div class="mb-3">
                                        <label class="form-label">Username</label>
                                        <input id="username" type="username" class="form-control">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="mb-4">
                                        <label class="form-label">Password</label>
                                        <input id="password" type="password" class="form-control">
                                        <div id="error-message" class="text-danger" style="display: none;">Invalid username or password</div>

                                    </div>
                                    <!-- Error message for invalid login -->
                                </div>

                                <div class="col-12">
                                    <div class="mb-3">
                                        <div class="form-check form-check-primary form-check-inline">
                                            <input class="form-check-input me-3" type="checkbox" id="form-check-default">
                                            <label class="form-check-label" for="form-check-default">
                                                Remember me
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                

                                <div class="col-12">
                                    <div class="mb-4">
                                        <button class="btn btn-secondary w-100" onclick="signIn()">SIGN IN</button>
                                    </div>
                                </div>
                            </div>
                            

                        </div>
                    </div>
                </div>
                
            </div>
            
        </div>

    </div>
    
    <!-- BEGIN GLOBAL MANDATORY SCRIPTS -->
    <script src="../src/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- END GLOBAL MANDATORY SCRIPTS -->
    <script>
        const accounts = [
            { username: 'admin', password: 'admin', role: 'admin' },
            { username: 'dispatcher', password: 'dispatcher', role: 'dispatcher' },
            { username: 'calltaker', password: 'calltaker', role: 'calltaker' },
        ];

        // Function to handle login
        function signIn() {
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;
            let correctCredentials = false;

            for (let i = 0; i < accounts.length; i++) {
                if (accounts[i].username === username && accounts[i].password === password) {
                    localStorage.setItem('role', accounts[i].role);
                    
                    if (accounts[i].role === 'admin') 
                        window.location.href = 'index.html';
                    else 
                        window.location.href = 'app-scrumboard.html';

                    correctCredentials = true;
                    break; // Exit loop once the user is found
                }
            }

            if (!correctCredentials) {
                document.getElementById('error-message').style.display = 'block'; // Show error message
            }
        }

        // Event listener for Enter key
        document.getElementById('password').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                signIn(); // Call signIn function when Enter is pressed
            }
        });
    </script>

</body>
</html>
